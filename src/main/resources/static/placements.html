
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placements Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }
        h1 { color: #263b80; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #263b80;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Placements Management</h1>
    <p>Candidate placement records</p>

    <table>
        <thead>
            <tr id="headers"></tr>
        </thead>
        <tbody id="placementData">
            <tr><td>Loading...</td></tr>
        </tbody>
    </table>

    <script>
        fetch('/api/placements')
            .then(response => {
                if (!response.ok) throw new Error('API Error');
                return response.json();
            })
            .then(data => {
                const headers = document.getElementById('headers');
                const body = document.getElementById('placementData');

                body.innerHTML = '';

                if (!data.length) {
                    body.innerHTML = '<tr><td>No placements found.</td></tr>';
                    return;
                }

                Object.keys(data[0]).forEach(key => {
                    const th = document.createElement('th');
                    th.textContent = key.replaceAll('_', ' ').toUpperCase();
                    headers.appendChild(th);
                });

                data.forEach(item => {
                    const tr = document.createElement('tr');

                    Object.values(item).forEach(value => {
                        const td = document.createElement('td');
                        td.textContent = value ?? '';
                        tr.appendChild(td);
                    });

                    body.appendChild(tr);
                });
            })
            .catch(error => {
                document.getElementById('placementData').innerHTML =
                    '<tr><td>Error loading placements.</td></tr>';
            });
    </script>

</body>
</html>
